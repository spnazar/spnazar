<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="spnazar — backend engineer, sysadmin, automation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D12"/>
      <stop offset="60%" stop-color="#0C131C"/>
      <stop offset="100%" stop-color="#101A26"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#18242F" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="round"><rect width="1000" height="250" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="250" fill="url(#bg)"/>
    <rect width="1000" height="250" fill="url(#grid)" opacity="0.55"/>
    <ellipse cx="250" cy="215" rx="380" ry="170" fill="url(#blob)"/>
    <ellipse cx="880" cy="40" rx="260" ry="150" fill="url(#blob)" opacity="0.7"/>

    <!-- window chrome -->
    <rect width="1000" height="40" fill="#0B1118"/>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#1B2734"/>
    <circle cx="26" cy="20" r="5.5" fill="#FF5F57" opacity="0.6"/>
    <circle cx="46" cy="20" r="5.5" fill="#FEBC2E" opacity="0.6"/>
    <circle cx="66" cy="20" r="5.5" fill="#28C840" opacity="0.6"/>
    <text x="96" y="25" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#4C5F72">spnazar@github: ~/workspace</text>

    <!-- prompt -->
    <text x="46" y="92" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#5B7186">
      <tspan fill="#2DD4BF">$</tspan> whoami
    </text>

    <!-- name -->
    <text x="44" y="162" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="60" font-weight="700" letter-spacing="1" fill="url(#accent)" filter="url(#soft)" opacity="0.55">spnazar</text>
    <text x="44" y="162" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="60" font-weight="700" letter-spacing="1" fill="url(#accent)">spnazar</text>

    <rect x="308" y="118" width="20" height="50" fill="#2DD4BF" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.85;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- subtitle -->
    <text x="47" y="204" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="4.2" fill="#55708A">BACKEND ENGINEER &#183; SYSADMIN &#183; AUTOMATION</text>

    <!-- server rack -->
    <g opacity="0.85">
      <rect x="800" y="66" width="150" height="34" rx="5" fill="#0E1822" stroke="#1E2C3A"/>
      <rect x="812" y="78" width="86" height="10" rx="2" fill="#16222E"/>
      <circle cx="925" cy="83" r="3.5" fill="#2DD4BF">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <rect x="800" y="108" width="150" height="34" rx="5" fill="#0E1822" stroke="#1E2C3A"/>
      <rect x="812" y="120" width="86" height="10" rx="2" fill="#16222E"/>
      <circle cx="925" cy="125" r="3.5" fill="#38BDF8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/>
      </circle>

      <rect x="800" y="150" width="150" height="34" rx="5" fill="#0E1822" stroke="#1E2C3A"/>
      <rect x="812" y="162" width="86" height="10" rx="2" fill="#16222E"/>
      <circle cx="925" cy="167" r="3.5" fill="#A78BFA">
        <animate attributeName="opacity" values="1;0.35;1" dur="3.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- bottom bar + scan sweep -->
    <rect x="0" y="246" width="1000" height="4" fill="#13202C"/>
    <rect x="0" y="246" width="1000" height="4" fill="url(#accent)" opacity="0.5"/>
    <rect x="-260" y="246" width="260" height="4" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1260 0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="999" height="249" rx="16" fill="none" stroke="#1E2C3A"/>
</svg>
